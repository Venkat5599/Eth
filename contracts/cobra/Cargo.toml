[package]
name = "cobra-contracts"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cobra Stylus contract — EscrowVault + AdvancePool"

[dependencies]
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
stylus-sdk = { workspace = true }

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]
