# Cobra Stylus contracts — workspace.
# Two deployable contracts:
#   cobra/            EscrowVault + AdvancePool (the money state machine)
#   credit-verifier/  Groth16 verifier (Rust→WASM) — the zk credit gate Cobra calls
#
# Each is deployed separately:
#   cargo stylus deploy --manifest-path credit-verifier/Cargo.toml ...
#   cargo stylus deploy --manifest-path cobra/Cargo.toml ...
[workspace]
members = ["cobra", "credit-verifier"]
resolver = "2"

[workspace.dependencies]
alloy-primitives = "=0.8.20"
alloy-sol-types = "=0.8.20"
stylus-sdk = "0.8.4"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
