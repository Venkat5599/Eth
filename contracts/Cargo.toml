[package]
name = "cobra-contracts"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cobra Stylus contracts — EscrowVault, AdvancePool, CreditVerifier gate"

[dependencies]
alloy-primitives = "=0.8.20"
alloy-sol-types = "=0.8.20"
stylus-sdk = "0.8.4"

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
